<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18263a">
<title>Career Lab | Laboratorio de decisiones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e9eeec; --surface:#ffffff; --ink:#18263a; --muted:#566574; --line:#cfd8d6;
  --cobalt:#2446c4; --cobalt-soft:#e3e9fb; --amber:#b87a0a; --amber-soft:#fbf1dc; --ok:#1f7a55; --ok-soft:#e1f2ea;
  --radius-l:20px; --radius-m:12px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1722; --surface:#172231; --ink:#e7edf3; --muted:#9aabbb; --line:#2b3a4c;
  --cobalt:#7d98ff; --cobalt-soft:#1f2c4d; --amber:#e3a93b; --amber-soft:#33291a; --ok:#5fcf9d; --ok-soft:#173327;}}
:root[data-theme="dark"]{
  --paper:#0f1722; --surface:#172231; --ink:#e7edf3; --muted:#9aabbb; --line:#2b3a4c;
  --cobalt:#7d98ff; --cobalt-soft:#1f2c4d; --amber:#e3a93b; --amber-soft:#33291a; --ok:#5fcf9d; --ok-soft:#173327;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 18px}
.brand{font-weight:800;font-stretch:118%;letter-spacing:-.01em;font-size:18px;color:var(--ink);background:none;border:0;padding:0;cursor:pointer}
.brand span{color:var(--cobalt)}
.who{font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:center}
.link{background:none;border:0;color:var(--cobalt);font:inherit;font-size:14px;cursor:pointer;padding:6px 2px;text-decoration:underline;text-underline-offset:3px}
h1,h2,h3{font-stretch:115%;letter-spacing:-.015em;line-height:1.12;margin:0}
h1{font-size:clamp(34px,8vw,54px);font-weight:850}
h2{font-size:clamp(25px,5.4vw,34px);font-weight:800}
h3{font-size:19px;font-weight:750}
p{margin:.6em 0}
.lede{font-size:19px;color:var(--muted);max-width:60ch}
.muted{color:var(--muted)}.small{font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:22px;margin:0 0 14px}
.hero{padding:28px 24px 26px}
label.f{display:block;font-weight:650;margin:22px 0 6px}
input[type=text],textarea{width:100%;font:inherit;font-size:18px;padding:14px;border:1.5px solid var(--line);border-radius:var(--radius-m);background:var(--surface);color:var(--ink)}
textarea{font-size:16px;min-height:96px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.btn{font:inherit;font-weight:700;min-height:50px;border-radius:var(--radius-m);padding:12px 18px;cursor:pointer;border:1.5px solid var(--ink);background:var(--ink);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.full{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 180px}
.err{color:#b3261e;font-size:14px;min-height:1.2em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 14px;cursor:pointer}
/* home */
.progressline{display:flex;gap:4px;margin:14px 0 4px}.progressline i{flex:1;height:6px;border-radius:6px;background:var(--line)}.progressline i.on{background:var(--ok)}
.sims{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.sims{grid-template-columns:1fr 1fr}}
.sim{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px}
.sim .n{font-weight:800;font-stretch:125%;color:var(--muted);font-size:14px}
.sim.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.status{font-size:13px;font-weight:650;color:var(--muted)}.sim.done .status{color:var(--ok)}
.sim .row{margin-top:auto;padding-top:8px}.sim .btn{min-height:44px;padding:9px 14px;font-size:15px}
/* play */
.simhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.steps{display:flex;gap:5px;margin:12px 0 0}.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}.steps i.on{background:var(--cobalt)}
.brief{border-left:4px solid var(--cobalt)}
.situ{padding:26px 22px}
.tag{font-size:14px;font-weight:700;color:var(--cobalt);margin-bottom:8px}
.body{font-size:18px;margin:14px 0 0;max-width:62ch}
.pressure{margin:16px 0 4px;padding:10px 14px;border-radius:10px;background:var(--amber-soft);color:var(--ink);font-size:15px;border-left:4px solid var(--amber)}
.gt{text-decoration:underline dotted;text-underline-offset:3px;text-decoration-thickness:1.5px}
.gloss{margin:14px 0 0;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:15px;background:var(--paper)}
.gloss summary{cursor:pointer;font-weight:650;color:var(--cobalt)}
.gloss p{margin:8px 0}
.opts{display:grid;gap:10px;margin:18px 0 6px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:15px 14px;cursor:pointer;transition:border-color .12s,background .12s}
.opt .k{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:800;font-stretch:120%;font-size:15px}
.opt b{display:block;font-weight:700;line-height:1.3}
.opt span.d{display:block;color:var(--muted);font-size:15px;margin-top:3px;line-height:1.4}
.opt[aria-pressed="true"]{border-color:var(--cobalt);background:var(--cobalt-soft)}
.opt[aria-pressed="true"] .k{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.note{font-size:13px;color:var(--muted);margin-top:10px}
/* reflection */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.scale button{font:inherit;font-weight:750;min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.scale button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.scalelbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px}
/* results */
.bar{margin:12px 0}.bar .l{display:flex;justify-content:space-between;font-size:15px;gap:8px}.bar .t{height:10px;border-radius:10px;background:var(--line);overflow:hidden;margin-top:5px}.bar .f{height:100%;background:var(--cobalt);border-radius:10px}
.bar .lvl{color:var(--muted);font-size:13px;white-space:nowrap}
.axis{margin:16px 0}.axis .poles{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.axis .track{position:relative;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--line),var(--line));margin:7px 0 3px}
.axis .track::after{content:"";position:absolute;left:50%;top:-4px;width:1.5px;height:16px;background:var(--muted);opacity:.5}
.axis .dot{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--cobalt);border:3px solid var(--surface);transform:translate(-50%,-50%);box-shadow:0 0 0 1.5px var(--cobalt)}
.axis .nm{font-weight:650;font-size:15px}
.interp{font-size:17px;max-width:64ch}
.dlist{margin:6px 0 0;padding:0;list-style:none;counter-reset:d}
.dlist li{counter-increment:d;padding:10px 0 10px 34px;position:relative;border-top:1px solid var(--line);font-size:15px}
.dlist li::before{content:counter(d);position:absolute;left:0;top:10px;font-weight:800;color:var(--muted);font-stretch:120%}
.dlist small{color:var(--muted)}
.reporttext{width:100%;min-height:180px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px}
.fam{padding:16px 0;border-top:1px solid var(--line)}.fam:first-of-type{border-top:0}
.fam .acad{font-size:14px;color:var(--muted)}
.flag{padding:12px 14px;border-radius:10px;background:var(--cobalt-soft);margin:8px 0;font-size:15px}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.q{border:1px solid var(--line);border-radius:12px;padding:12px;min-height:110px;background:var(--surface)}
.q1{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.ql{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px;line-height:1.3}
.qi{margin:6px 0;line-height:1.25}.qi b{display:block;font-size:14.5px}.qi span{font-size:12.5px;color:var(--muted)}
.qe{font-size:13px;color:var(--muted)}
.qaxis{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart text{font-family:inherit;fill:var(--ink)}
.cols{display:grid;gap:12px}@media(min-width:640px){.cols{grid-template-columns:1fr 1fr}}
.foot{text-align:center;color:var(--muted);font-size:13px;padding:22px 8px}

/* modo incrustado (Google Sites): tipografía compacta y desplazamiento interno */
html.embed,html.embed body{height:100%}
html.embed body{overflow-y:auto;-webkit-overflow-scrolling:touch;font-size:16px}
html.embed .wrap{padding:10px 12px 28px}
html.embed .top{padding:2px 0 10px}
html.embed h1{font-size:clamp(26px,7vw,40px)}
html.embed h2{font-size:clamp(21px,5.5vw,28px)}
html.embed .lede{font-size:16px}
html.embed .hero{padding:20px 18px}
html.embed .panel{padding:16px;border-radius:16px}
html.embed .situ{padding:18px 16px}
html.embed .body{font-size:16px}
html.embed .opt{padding:12px}
.hide{display:none!important}.printonly{display:none}@media print{.printonly{display:block}}
@media(prefers-reduced-motion:no-preference){.enter{animation:rise .28s ease-out}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
@media print{
  :root{--paper:#fff;--surface:#fff;--ink:#111;--line:#ccc}
  body{font-size:12pt}.noprint,.top{display:none!important}.panel{border:0;padding:8px 0;break-inside:avoid}.wrap{max-width:none;padding:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top noprint">
    <button class="brand" id="brand" type="button">Career <span>Lab</span></button>
    <div class="who" id="who"></div>
  </header>
  <main id="app"></main>
  <div class="foot noprint">Career Lab v3. Exploración vocacional basada en decisiones simuladas. Los resultados se guardan solo en este navegador.</div>
</div>

<script>
try{if(window.self!==window.top)document.documentElement.classList.add("embed")}catch(e){document.documentElement.classList.add("embed")}
(function(){
"use strict";

/* ============ MODELO ============
   Tres señales independientes:
   1) Career DNA de dominio: 6 dimensiones por simulación, normalizadas por el máximo alcanzable.
   2) Estilo transversal: 5 ejes bipolares (ninguno de los polos es mejor).
   3) Criterio: 2 situaciones por simulación contienen una trampa de razonamiento (q: 0, 1 o 2).
   Más interés declarado (disfrute 1-5) al cerrar cada simulación.
   x = [ana, rie, pla, peo, cre] con valores -1, 0 o 1. */

var AX=[
 {k:"ana",name:"Análisis o acción",neg:"actuar rápido y aprender en el camino",pos:"analizar antes de actuar"},
 {k:"rie",name:"Riesgo",neg:"proteger lo que ya existe",pos:"apostar por el potencial"},
 {k:"pla",name:"Horizonte",neg:"asegurar resultados inmediatos",pos:"pensar en el largo plazo"},
 {k:"peo",name:"Foco",neg:"apoyarse en números y sistemas",pos:"poner a las personas en el centro"},
 {k:"cre",name:"Modo",neg:"ejecutar y optimizar lo conocido",pos:"explorar caminos nuevos"}
];
var CAP={cuant:"Razonamiento cuantitativo",evid:"Análisis y evidencia",sist:"Pensamiento estratégico y sistémico",expe:"Creatividad y experimentación",pers:"Personas y comunicación",juic:"Juicio frente al riesgo y la ética",ejec:"Ejecución y decisión"};
var CAPVERB={cuant:"cuantificar",evid:"analizar",sist:"diseñar estrategias",expe:"experimentar",pers:"comunicar",juic:"evaluar riesgos",ejec:"decidir"};

function O(t,d,w,x,q){return {t:t,d:d,w:w,x:x,q:q}}
function R(kind,tag,title,body,pressure,opts){return {kind:kind,tag:tag,title:title,body:body,pressure:pressure,opts:opts}}

var GLOSS={
 "margen":"Lo que te queda de cada venta después de pagar lo que cuesta producirla.",
 "inversionista":"Persona que pone dinero en tu empresa a cambio de ser dueña de una parte.",
 "acciones":"Pedacitos de una empresa que se compran y venden. Su precio sube y baja; a largo plazo suelen ganar más que un banco, pero con más sustos.",
 "plazo fijo":"Dinero que dejas en el banco por un tiempo acordado. No pierde valor, pero gana poco.",
 "intereses":"Lo que te paga el banco por dejarle tu dinero.",
 "copias de seguridad":"Copias guardadas de la información, por si la original se pierde o se daña.",
 "verificación en dos pasos":"Además de la contraseña, te piden un código que llega a tu celular.",
 "virus":"Programa dañino que entra a una computadora sin permiso.",
 "comité de ética":"Grupo de expertos que ayuda a decidir casos difíciles donde hay valores en juego.",
 "hectárea":"Un terreno de 100 por 100 metros, más o menos una manzana grande.",
 "plaga":"Insectos u hongos que dañan los cultivos.",
 "control biológico":"Usar insectos u organismos naturales que se comen la plaga, en lugar de químicos.",
 "residuos":"Restos de químicos que quedan en la fruta. Los países compradores ponen límites estrictos.",
 "certificación orgánica":"Sello que garantiza que se cultivó sin químicos sintéticos. Permite vender más caro.",
 "baterías":"Guardan la energía de los paneles para usarla de noche o cuando no hay sol.",
 "retorno":"Lo que ganas con una inversión comparado con lo que pusiste."
};

var SIMS=[
{id:"neg",title:"Negocios y estrategia",short:"Negocios",sub:"Crea un negocio y defiéndelo cuando aparecen problemas.",
 role:"Eres cofundador de StudyMate, una app que conecta alumnos de colegio con tutores universitarios.",
 context:"Tienes $25.000 entre ahorros y un préstamo de tu familia. Alcanza para funcionar unos seis meses.",
 dims:["Visión estratégica","Números del negocio","Análisis","Creatividad","Riesgo","Liderazgo"],
 caps:["sist","cuant","evid","expe","juic","pers"],
 rounds:[
 R("d","Arranque","¿Cómo consigues tus primeros usuarios?","La app ya funciona. Ahora necesitas que la gente la use, con un presupuesto que no permite muchos errores.","Tu socio quiere una decisión hoy.",[
  O("Un solo colegio, a fondo","No pasar a otro colegio hasta que 4 de cada 10 alumnos usen la app.",[2,1,2,0,0,1],[1,-1,1,0,-1]),
  O("Toda la ciudad por redes","Publicidad en TikTok e Instagram para llegar a alumnos de muchos colegios a la vez.",[0,0,0,2,3,1],[-1,1,0,0,1]),
  O("Venderle al colegio, no al alumno","Convencer a los rectores de pagar un año completo. Cuesta cerrar la venta, pero es dinero seguro.",[3,2,1,0,0,0],[0,-1,1,-1,0]),
  O("Probar tres ideas a la vez","Tutorías, apuntes compartidos y preparación para la universidad, con $3.000 cada una. Te quedas con la que funcione.",[0,0,2,3,1,0],[-1,0,0,0,1])]),
 R("c","Números","¿Este negocio gana dinero?","Cada clase le cuesta $10 al alumno y al tutor le pagas $7. Para conseguir un alumno nuevo gastas $12 en publicidad. En promedio, cada alumno toma 3 clases y no vuelve.","Tu {{inversionista}} pregunta por qué se acaba la plata si las ventas suben.",[
  O("Cada alumno nuevo nos hace perder plata","Hay que arreglar eso antes de pensar en crecer.",[1,3,2,0,0,0],[1,-1,0,-1,0],2),
  O("Hay que crecer rápido","Con más alumnos, la publicidad se abaratará sola.",[1,0,0,1,3,1],[-1,1,0,0,0],0),
  O("Subir el precio a $13","Así cada clase deja $6 en lugar de $3.",[1,2,1,0,1,1],[0,0,0,-1,0],1),
  O("Está bien así","Ganar $3 de cada $10 es un {{margen}} normal.",[1,1,1,0,1,0],[-1,0,0,0,-1],0)]),
 R("d","Competencia","Llega un gigante","Una empresa grande, con 20 veces tu dinero, lanza una app parecida, 25% más barata y con mucha publicidad.","Tus tutores empiezan a preguntar si deberían cambiarse.",[
  O("Ser mejores, no más baratos","Tutores verificados, seguimiento de notas y trato cercano.",[3,0,0,2,0,1],[0,-1,1,1,0]),
  O("Proponerles una alianza o venderles","Negociar ahora, mientras tienes usuarios que les interesan.",[1,3,1,0,0,1],[0,-1,-1,-1,0]),
  O("Irte a un espacio que no les interesa","Por ejemplo, preparar a alumnos para becas en el extranjero.",[2,0,1,2,1,0],[0,1,1,0,1]),
  O("Bajar el precio y aguantar","Recortar gastos al máximo y competir de frente.",[0,2,0,0,3,1],[-1,1,-1,-1,-1])]),
 R("d","Equipo","Tus socios no se ponen de acuerdo","Tu socio de operaciones quiere ahorrar y ordenar la empresa. Tu socia de marketing quiere lanzar cosas nuevas. Los dos dicen que se van si no los apoyas.","La reunión es en una hora.",[
  O("Definir la meta del año y decidir con base en ella","Que la meta decida, no quién presiona más.",[3,0,1,0,0,2],[1,0,1,-1,0]),
  O("Sentarlos juntos a buscar una solución","Que los dos se comprometan con lo que salga.",[2,0,0,1,0,3],[0,0,0,1,1]),
  O("Este año ahorrar, el próximo innovar","Ordenar las prioridades en el tiempo.",[1,3,1,0,0,1],[0,-1,0,-1,-1]),
  O("Un poco de dinero aparte para lo nuevo","Proteger las ideas nuevas sin descuidar lo demás.",[1,1,0,2,2,0],[0,1,1,0,1])]),
 R("c","Recursos","Solo alcanza para una cosa","Ya gastaste $6.000 en una función de la app que no está lista. Terminarla cuesta $3.000 más y esperas que te deje $2.000. Otra idea nueva cuesta $3.000 y esperas que te deje $4.500.","El programador que hizo la primera te pide no abandonarla.",[
  O("Terminar la primera","Ya invertiste $6.000; abandonarla sería perderlos.",[0,0,0,0,1,2],[-1,0,0,0,0],0),
  O("Hacer la idea nueva","Es la que mejor usa el dinero que te queda.",[1,3,2,0,0,0],[1,0,1,-1,0],2),
  O("Terminar la primera, por el equipo","Abandonarla desanimaría a quien trabajó en ella.",[0,0,0,0,0,3],[0,-1,0,1,0],1),
  O("Poner $1.500 en cada una","Mantener las dos posibilidades vivas.",[0,1,0,1,1,0],[0,-1,0,0,0],0)])
 ]},

{id:"fin",title:"Finanzas y economía",short:"Finanzas",sub:"Decide qué hacer con el dinero de otros y con el de una ciudad.",
 role:"Trabajas en una firma que asesora a familias y a municipios sobre cómo manejar su dinero.",
 context:"Tus clientes confían en ti, pero van a revisar cada recomendación. Un error aquí lo paga otra persona.",
 dims:["Cálculo","Riesgo y retorno","Evidencia","Incentivos","Visión de sistema","Disciplina"],
 caps:["cuant","juic","evid","sist","sist","ejec"],
 rounds:[
 R("d","Familia","$100.000 para la universidad","La familia Salazar quiere pagar la universidad de sus dos hijos. La mayor entra en 2 años; el menor, en 7.","La madre te pide una propuesta para mañana.",[
  O("Dos bolsillos distintos","Lo de la mayor en un {{plazo fijo}}; lo del menor, más en {{acciones}}.",[2,2,0,0,0,2],[1,-1,1,0,0]),
  O("Mitad banco, mitad acciones","Simple y fácil de mantener sin tocarlo.",[0,2,0,0,1,3],[0,-1,1,0,-1]),
  O("Casi todo en acciones","En siete años pueden ganar bastante más, aunque haya caídas en el camino.",[1,3,0,0,2,0],[0,1,1,0,0]),
  O("Todo a plazo fijo","Gana poco, pero es imposible perder.",[1,2,0,0,0,3],[0,-1,-1,0,-1])]),
 R("c","Cálculo","Dos opciones del banco","Opción A: el banco te paga 8% cada año y esos {{intereses}} también van ganando intereses, durante 9 años. Opción B: a los 10 años te devuelven el doble de lo que pusiste. Los dos bancos son igual de seguros.","El cliente quiere una respuesta clara.",[
  O("A","Es la que más conviene, aunque 8% parezca poco.",[3,1,1,0,0,0],[1,0,0,-1,0],2),

var NS="careerlab.v3.";
function sget(k){try{var v=localStorage.getItem(NS+k);return v?JSON.parse(v):null}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(NS+k,JSON.stringify(v))}catch(e){}}
function slug(n){return n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-")}
function people(){return sget("people")||[]}
function addPerson(n){var p=people().filter(function(x){return slug(x)!==slug(n)});p.unshift(n);sset("people",p.slice(0,8))}

var S={name:"",data:{attempts:{}},run:null};
function loadP(){S.data=sget("p."+slug(S.name))||{attempts:{}}}
function saveP(){sset("p."+slug(S.name),S.data)}
function saveRun(){if(S.run)sset("run."+slug(S.name),{i:S.run.i,round:S.run.round,picks:S.run.picks,orders:S.run.orders,t0:S.run.t0})}
function clearRun(){try{localStorage.removeItem(NS+"run."+slug(S.name))}catch(e){}}
function pendingRun(){return sget("run."+slug(S.name))}
function askPersist(){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}}
function b64e(str){return btoa(unescape(encodeURIComponent(str)))}
function b64d(str){return decodeURIComponent(escape(atob(str)))}
function picksOf(s,at){
  if(at.p)return at.p;
  return at.choices.map(function(c,k){var r=s.rounds[k];for(var i=0;i<4;i++)if(plain(r.opts[i].t)===c.t)return {o:i,ms:c.ms};return {o:0,ms:c.ms}});
}
function exportCode(){
  var a={};
  SIMS.forEach(function(s){var list=S.data.attempts[s.id];if(!list)return;
    a[s.id]=list.map(function(at){var p=picksOf(s,at);return [at.date,p.map(function(x){return x.o}).join(""),p.map(function(x){return Math.round(x.ms/1000)}),at.enjoy,at.diff,at.note||"",at.secs]})});
  return "CL3-"+b64e(JSON.stringify({v:3,n:S.name,a:a}));
}
function importCode(code){
  code=String(code||"").replace(/\s+/g,"");
  if(code.indexOf("CL3-")!==0)throw new Error("fmt");
  var o=JSON.parse(b64d(code.slice(4)));if(!o||o.v!==3||!o.n||!o.a)throw new Error("fmt");
  var data={attempts:{}};
  SIMS.forEach(function(s,i){var list=o.a[s.id];if(!list)return;
    data.attempts[s.id]=list.map(function(x){
      var run={i:i,picks:x[1].split("").map(function(c,k){return {o:+c,ms:(x[2][k]||0)*1000}}),enjoy:x[3],diff:x[4]};
      return scoreRun(run,x[5],x[0],x[6]);
    });
  });
  return {name:String(o.n).replace(/[<>]/g,"").slice(0,40),data:data};
}
function first(id){var a=S.data.attempts[id];return a&&a.length?a[0]:null}
function doneCount(){return SIMS.filter(function(s){return first(s.id)}).length}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function gl(t){return String(t).replace(/\{\{([^}]+)\}\}/g,'<span class="gt">$1</span>')}
function plain(t){return String(t).replace(/\{\{([^}]+)\}\}/g,"$1")}
function glossBox(texts){var seen=[];texts.join(" ").replace(/\{\{([^}]+)\}\}/g,function(_,k){if(GLOSS[k]&&seen.indexOf(k)<0)seen.push(k)});
  return seen.length?'<details class="gloss"><summary>¿Alguna palabra nueva? Toca aquí</summary>'+seen.map(function(k){return '<p><b>'+k[0].toUpperCase()+k.slice(1)+':</b> '+GLOSS[k]+'</p>'}).join("")+'</details>':''}
function pad(n){return String(n).padStart(2,"0")}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function mount(html){app.innerHTML='<div class="enter">'+html+'</div>';window.scrollTo(0,0);document.body.scrollTop=0;document.documentElement.scrollTop=0;renderWho()}
function on(id,fn){var el=document.getElementById(id);if(el)el.onclick=fn}
function fdate(iso){return new Date(iso).toLocaleDateString("es-EC",{day:"numeric",month:"long",year:"numeric"})}
function level(v){return v>=.75?"muy marcada":v>=.55?"marcada":v>=.35?"presente":"menor"}
function renderWho(){

function viewReflect(){
  var run=S.run,s=SIMS[run.i];run.enjoy=0;run.diff=0;

   '<label class="f">¿Cuánto disfrutaste este tipo de problema?</label>'+scale("sEnjoy","Nada","Muchísimo")+
   '<label class="f">¿Qué tan difícil te resultó?</label>'+scale("sDiff","Muy fácil","Muy difícil")+
   '<label class="f" for="note">¿Qué decisión te costó más y por qué? <span class="muted small">(opcional)</span></label>'+
   '<textarea id="note" maxlength="600" placeholder="Una o dos frases bastan."></textarea>'+
   '<div class="err" id="err"></div><button class="btn full" id="fin" type="button" style="margin-top:8px">Ver mi resultado</button></section>');
  [["sEnjoy","enjoy"],["sDiff","diff"]].forEach(function(p){
    var bs=document.querySelectorAll("#"+p[0]+" button");
    Array.prototype.forEach.call(bs,function(b){b.onclick=function(){Array.prototype.forEach.call(bs,function(x){x.setAttribute("aria-pressed","false")});b.setAttribute("aria-pressed","true");run[p[1]]=+b.getAttribute("data-n")}});
  });
  on("fin",function(){
    if(!run.enjoy||!run.diff){document.getElementById("err").textContent="Marca cuánto lo disfrutaste y qué tan difícil te resultó.";return}
    var at=scoreRun(run,document.getElementById("note").value.trim().slice(0,600));
    (S.data.attempts[s.id]=S.data.attempts[s.id]||[]).push(at);saveP();clearRun();
    var isFirst=S.data.attempts[s.id].length===1;S.run=null;
    viewResult(s,at,isFirst);
  });
}

function scoreRun(run,note,date,secs){
  var s=SIMS[run.i],sc=[0,0,0,0,0,0],ax=[0,0,0,0,0],crit=[],choices=[];
  run.picks.forEach(function(p,k){
    var r=s.rounds[k],o=r.opts[p.o];
    for(var i=0;i<6;i++)sc[i]+=o.w[i];
    for(var j=0;j<5;j++)ax[j]+=o.x[j];
    if(r.kind==="c")crit.push(o.q);
    choices.push({tag:r.tag,t:plain(o.t),ms:p.ms,c:r.kind==="c"?o.q:null});
  });
  return {date:date||new Date().toISOString(),p:run.picks.map(function(x){return {o:x.o,ms:x.ms}}),scores:sc,norm:sc.map(function(v,i){return v/s.max[i]}),axes:ax.map(function(v){return v/s.rounds.length}),
    crit:crit,enjoy:run.enjoy,diff:run.diff,note:note,choices:choices,secs:secs!=null?secs:Math.round((Date.now()-run.t0)/1000)};
}

/* ============ INTERPRETACIÓN ============ */
function topDims(s,at){return at.norm.map(function(v,i){return [v,i]}).sort(function(a,b){return b[0]-a[0]})}
function critText(c){
  var full=c.filter(function(q){return q===2}).length,part=c.filter(function(q){return q===1}).length,intu=c.filter(function(q){return q===0}).length,bits=[];
  if(full===2)return "identificó el razonamiento de fondo en ambas";
  if(full===1)bits.push("identificó el razonamiento de fondo en una");
  if(part)bits.push(part===2?"abordó ambas de forma parcial":(full?"abordó la otra de forma parcial":"abordó una de forma parcial"));
  if(intu)bits.push(intu===2?"en ambas se inclinó por la respuesta más intuitiva":(full||part?"en la otra se inclinó por la respuesta más intuitiva":"en una se inclinó por la respuesta más intuitiva"));
  return bits.join(" y ");
}
function axisText(axes,scope){
  var best=-1,bi=0;axes.forEach(function(v,i){if(Math.abs(v)>best){best=Math.abs(v);bi=i}});
  if(best<.4)return scope+" combinó estilos sin una inclinación marcada.";
  return scope+" tendió a "+(axes[bi]>0?AX[bi].pos:AX[bi].neg)+".";
}
function simInterp(s,at,name){
  var t=topDims(s,at);
  return "En "+s.title+", "+name+" se inclinó por decisiones asociadas con "+s.dims[t[0][1]].toLowerCase()+" y "+s.dims[t[1][1]].toLowerCase()+". "+
   axisText(at.axes,"En su estilo de decisión")+" En las dos situaciones que contenían una trampa de razonamiento, "+critText(at.crit)+". "+
   "Calificó su disfrute con "+at.enjoy+" de 5 y la dificultad con "+at.diff+" de 5. Es una lectura exploratoria que gana valor al compararla con las otras simulaciones.";
}
function bars(labels,vals){
  return labels.map(function(l,i){var v=Math.max(0,Math.min(1,vals[i]));return '<div class="bar"><div class="l"><span>'+l+'</span><span class="lvl">'+level(v)+'</span></div><div class="t"><div class="f" style="width:'+Math.max(4,Math.round(v*100))+'%"></div></div></div>'}).join("");
}
function axesHtml(axes){
  return AX.map(function(a,i){var v=Math.max(-1,Math.min(1,axes[i]));return '<div class="axis"><div class="nm">'+a.name+'</div><div class="track"><span class="dot" style="left:'+((v+1)/2*100)+'%"></span></div><div class="poles"><span>'+a.neg[0].toUpperCase()+a.neg.slice(1)+'</span><span style="text-align:right">'+a.pos[0].toUpperCase()+a.pos.slice(1)+'</span></div></div>'}).join("");
}

function simReport(s,at){
  var t=topDims(s,at);
  return "CAREER LAB | "+s.title.toUpperCase()+"\nParticipante: "+S.name+"\nFecha: "+fdate(at.date)+"\nDuración: "+Math.max(1,Math.round(at.secs/60))+" min\n\n"+
   "CAREER DNA DE LA SIMULACIÓN\n"+s.dims.map(function(d,i){return "  "+d+": "+level(at.norm[i])}).join("\n")+
   "\n\nDimensiones predominantes: "+s.dims[t[0][1]]+" y "+s.dims[t[1][1]]+
   "\n\nDECISIONES\n"+at.choices.map(function(c,i){return "  "+(i+1)+". "+c.tag+": "+c.t+" ("+Math.round(c.ms/1000)+" s)"}).join("\n")+
   "\n\nDisfrute: "+at.enjoy+"/5   Dificultad percibida: "+at.diff+"/5"+
   (at.note?"\nLa decisión que más le costó: "+at.note:"")+
   "\n\nINTERPRETACIÓN\n"+simInterp(s,at,S.name)+"\n\nNota: resultado exploratorio; no es un diagnóstico vocacional.";
}

/* ============ MAESTRO ============ */
function master(){
  var M={sims:[],caps:{},axes:[0,0,0,0,0],axSims:[[],[],[],[],[]]};
  var capAcc={};
  SIMS.forEach(function(s){
    var a=first(s.id);if(!a)return;
    var crit=(a.crit[0]+a.crit[1])/4,interest=(a.enjoy-1)/4;
    M.sims.push({s:s,a:a,crit:crit,interest:interest,signal:.55*interest+.45*crit});
    s.caps.forEach(function(c,i){(capAcc[c]=capAcc[c]||[]).push(a.norm[i])});
    a.axes.forEach(function(v,j){M.axSims[j].push({s:s,v:v})});
  });
  Object.keys(CAP).forEach(function(c){var v=capAcc[c]||[0];M.caps[c]=v.reduce(function(x,y){return x+y},0)/v.length});
  M.axes=M.axSims.map(function(l){return l.reduce(function(x,y){return x+y.v},0)/l.length});
  M.spread=M.axSims.map(function(l){var vs=l.map(function(x){return x.v});return Math.max.apply(null,vs)-Math.min.apply(null,vs)});
  var bySim={};M.sims.forEach(function(x){bySim[x.s.id]=x});M.by=bySim;
  M.fams=FAMILIES.map(function(f){
    var tw=0,acc=0;Object.keys(f.s).forEach(function(id){tw+=f.s[id];acc+=f.s[id]*bySim[id].signal});
    var ak=Object.keys(f.a),fit=ak.reduce(function(x,k){var j=AX.map(function(a){return a.k}).indexOf(k);return x+(f.a[k]*M.axes[j]+1)/2},0)/ak.length;
    return {f:f,score:.8*acc/tw+.2*fit,core:Object.keys(f.s).sort(function(a,b){return f.s[b]-f.s[a]})};
  }).sort(function(a,b){return b.score-a.score});
  return M;
}
function famEvidence(x,M){
  var main=M.by[x.core[0]],bits=[];
  bits.push("En "+main.s.title+" calificó su disfrute con "+main.a.enjoy+" de 5 y, en las dos situaciones con trampa de razonamiento, "+critText(main.a.crit));
  var others=x.core.slice(1).map(function(id){return M.by[id]}).filter(function(o){return o.signal>=.6});
  if(others.length)bits.push("la señal se repite en "+others.map(function(o){return o.s.title}).join(" y "));
  var ak=Object.keys(x.f.a),match=ak.filter(function(k){var j=AX.map(function(a){return a.k}).indexOf(k);return x.f.a[k]*M.axes[j]>=.2});
  if(match.length)bits.push("y su estilo tiende a "+match.map(function(k){var j=AX.map(function(a){return a.k}).indexOf(k);return x.f.a[k]>0?AX[j].pos:AX[j].neg}).join(" y "));
  return bits.join("; ")+".";
}
function quad(M){
  var Q=[[],[],[],[]];
  M.sims.forEach(function(x){var hi=x.a.enjoy>=4,hc=x.crit>=.75;Q[hc?(hi?1:0):(hi?3:2)].push(x)});
  var lab=["Criterio sólido, interés moderado o bajo","Le atrae y razona con solidez","Ni interés ni criterio marcados por ahora","Le atrae, criterio por desarrollar"];
  return '<div class="quad">'+Q.map(function(l,i){return '<div class="q q'+i+'"><div class="ql">'+lab[i]+'</div>'+(l.length?l.map(function(x){return '<div class="qi"><b>'+x.s.title+'</b><span>interés '+x.a.enjoy+'/5, criterio '+(x.a.crit[0]+x.a.crit[1])+'/4</span></div>'}).join(""):'<div class="qe">Ninguna</div>')+'</div>'}).join("")+'</div>'+
   '<div class="qaxis"><span>Menos interés</span><span>Más interés</span></div>';
}
function viewMaster(){
  var M=master(),name=S.name;
  var capKeys=Object.keys(CAP).sort(function(a,b){return M.caps[b]-M.caps[a]});
  var liked=M.sims.slice().sort(function(a,b){return b.a.enjoy-a.a.enjoy||b.crit-a.crit}).slice(0,3);
  var flags=[];
  M.sims.forEach(function(x){
    if(x.crit>=.75&&x.a.enjoy<=2)flags.push("En "+x.s.title+" resolvió bien las trampas de razonamiento, pero dijo disfrutarlo poco ("+x.a.enjoy+"/5). Hay capacidad sin entusiasmo; vale la pena preguntarle qué no le gustó.");
    if(x.a.enjoy>=4&&x.crit<=.25)flags.push("En "+x.s.title+" mostró mucho interés ("+x.a.enjoy+"/5), aunque en las trampas se inclinó por respuestas intuitivas. Es un área que le atrae y donde aprender algunas herramientas podría marcar diferencia.");
  });
  M.spread.map(function(sp,j){return [sp,j]}).sort(function(a,b){return b[0]-a[0]}).slice(0,2).forEach(function(p){var sp=p[0],j=p[1];
    if(sp>=1.2){var l=M.axSims[j].slice().sort(function(a,b){return a.v-b.v});flags.push("Su estilo en «"+AX[j].name.toLowerCase()+"» cambia según el contexto: en "+l[l.length-1].s.title+" tendió a "+AX[j].pos+", mientras que en "+l[0].s.title+" tendió a "+AX[j].neg+". Adaptar el estilo al problema puede ser una fortaleza.")}
  });
  var rie=M.axes[1],riskTxt=rie>=.25?"En conjunto tendió a apostar por el potencial, aceptando incertidumbre cuando veía una oportunidad.":rie<=-.25?"En conjunto tendió a proteger lo que ya existe y a limitar la exposición antes de arriesgar.":"Frente al riesgo no mostró una inclinación fija: en unos casos protegió, en otros apostó.";
  var top3=M.fams.slice(0,4);
  var totalMin=Math.round(M.sims.reduce(function(x,y){return x+y.a.secs},0)/60);
  var questions=[
    "¿Qué tuvieron en común las simulaciones que más disfrutaste ("+liked.map(function(x){return x.s.title}).join(", ")+")?",
    "Cuando elegiste "+(M.axes[0]>=0?"analizar antes de actuar":"actuar rápido")+", ¿qué te hizo sentir más seguro de esa decisión?",
    "De los campos que aparecen abajo, ¿cuál te da curiosidad conocer por dentro, con una visita o una conversación con alguien que trabaje ahí?"
  ];

  var rep="CAREER LAB | MASTER REPORT\nParticipante: "+name+"\nFecha: "+fdate(new Date().toISOString())+"\nSimulaciones completadas: 10 de 10 ("+totalMin+" min en total)\n\n"+
   "CAPACIDADES QUE MÁS APARECIERON\n"+capKeys.slice(0,4).map(function(c){return "  "+CAP[c]+": "+level(M.caps[c])}).join("\n")+
   "\n\nESTILO DE DECISIÓN\n"+AX.map(function(a,i){var v=M.axes[i];return "  "+a.name+": "+(Math.abs(v)<.2?"equilibrado":(v>0?a.pos:a.neg))}).join("\n")+
   "\n\nINTERÉS Y CRITERIO POR SIMULACIÓN\n"+M.sims.map(function(x){return "  "+x.s.title+": disfrute "+x.a.enjoy+"/5, criterio "+(x.a.crit[0]+x.a.crit[1])+"/4"}).join("\n")+
   "\n\nRIESGO\n  "+riskTxt+
   (flags.length?"\n\nPATRONES QUE MERECEN CONVERSACIÓN\n"+flags.map(function(f){return "  "+f}).join("\n"):"")+
   "\n\nCAMPOS QUE VALE LA PENA EXPLORAR\n"+top3.map(function(x){return "  "+x.f.n+"\n    Evidencia: "+famEvidence(x,M)+"\n    Opciones académicas relacionadas: "+x.f.acad}).join("\n")+
   "\n\nEste reporte resume patrones observados en diez simulaciones. No es un diagnóstico psicométrico ni una recomendación de carrera; es una base para conversar y explorar.";

  mount(
   '<section class="panel hero"><div class="tag">Career DNA Maestro</div><h1 style="font-size:clamp(30px,7vw,46px)">'+esc(name)+'</h1><p class="lede">Integración de diez simulaciones. Lo valioso aquí no es ningún número, sino lo que se repite, lo que cambia y lo que sorprende.</p></section>'+
   '<section class="panel"><h3>Mapa de interés y criterio</h3><p class="small muted">Cada simulación ubicada según cuánto la disfrutó (4 o 5 cuenta como alto) y cuántas trampas de razonamiento reconoció (3 o 4 de 4 cuenta como alto). Arriba, más criterio; a la derecha, más interés.</p>'+quad(M)+'</section>'+
   '<section class="panel"><h3>Capacidades que más aparecieron</h3><p class="small muted">Agrupan las 60 dimensiones de las simulaciones en siete capacidades transversales.</p>'+bars(capKeys.map(function(c){return CAP[c]}),capKeys.map(function(c){return M.caps[c]}))+
   '<p style="margin-top:14px">Sus decisiones sugieren una preferencia por '+capKeys.slice(0,3).map(function(c){return CAPVERB[c]}).join(", ").replace(/, ([^,]*)$/," y $1")+'.</p></section>'+
   '<section class="panel"><h3>Estilo de decisión</h3>'+axesHtml(M.axes)+'<p>'+esc(riskTxt)+'</p></section>'+
   '<section class="panel"><h3>Tipo de problemas que más disfrutó</h3><p>'+liked.map(function(x){return '<b>'+x.s.title+'</b> ('+x.a.enjoy+'/5)'}).join(", ")+'. Si estas simulaciones comparten algo, por ejemplo números, personas, tecnología o competencia, esa es una pista más fuerte que cualquier puntaje.</p></section>'+
   (flags.length?'<section class="panel"><h3>Patrones que merecen conversación</h3>'+flags.map(function(f){return '<div class="flag">'+esc(f)+'</div>'}).join("")+'</section>':'')+
   '<section class="panel"><h3>Campos que vale la pena explorar</h3><p class="small muted">Del perfil de pensamiento al campo profesional y luego a opciones académicas. Son hipótesis para investigar, no recomendaciones.</p>'+
    top3.map(function(x){return '<div class="fam"><h3>'+x.f.n+'</h3><p class="small">'+esc(famEvidence(x,M))+'</p><p class="acad">Opciones académicas relacionadas: '+x.f.acad+'</p></div>'}).join("")+'</section>'+
   '<section class="panel"><h3>Para conversar en casa</h3><ol class="dlist">'+questions.map(function(q){return '<li>'+esc(q)+'</li>'}).join("")+'</ol>'+
    '<p class="small muted" style="margin-top:12px">Career Lab explora diez campos elegidos por su demanda esperada hacia 2030. No cubre derecho, educación, ciencias sociales, artes escénicas ni otros campos; un interés bajo en todas las simulaciones también es información útil.</p></section>'+
   shareBlock(rep)+
   '<button class="btn full noprint" id="home" type="button">Volver a Career Lab</button>');
  wireShare(rep,"Career Lab | Master Report | "+name);
  on("home",viewHome);
}

function viewGuide(){
  mount('<section class="panel hero"><div class="tag">Guía para padres y orientadores</div><h2>Cómo leer Career Lab</h2>'+
  '<p class="body">Career Lab no pregunta qué carrera le gusta al participante. Lo pone en diez situaciones profesionales simuladas y observa cómo decide. Cada simulación tiene cinco decisiones y produce tres señales distintas, que conviene leer juntas.</p></section>'+
  '<section class="panel"><h3>1. Career DNA: hacia dónde se inclinan sus decisiones</h3><p>Tres de cada cinco situaciones son dilemas donde todas las opciones son razonables y cada una sacrifica algo: rentabilidad frente a riesgo, velocidad frente a precisión, personas frente a números. Estas decisiones no se califican como buenas o malas; alimentan seis dimensiones propias de cada dominio y cinco ejes de estilo que se comparan entre simulaciones.</p></section>'+
  '<section class="panel"><h3>2. Criterio: en qué razona con más solidez</h3><p>Las otras dos situaciones de cada simulación contienen una trampa de razonamiento conocida, como confundir correlación con causa, dejarse llevar por lo ya gastado o leer mal un promedio. Estas sí distinguen entre un razonamiento más sólido y uno más intuitivo, y son la mejor aproximación a la pregunta de en qué es bueno. Con dos situaciones por dominio, la señal es orientativa; lo que importa es si se repite.</p></section>'+
  '<section class="panel"><h3>3. Interés: qué disfruta</h3><p>Al cerrar cada simulación el participante indica cuánto la disfrutó y qué tan difícil le resultó. El reporte maestro cruza interés con criterio: lo más prometedor está donde ambos coinciden, y las diferencias, por ejemplo capacidad sin entusiasmo, son una buena puerta para conversar.</p></section>'+
  '<section class="panel"><h3>Recomendaciones de uso</h3><p>Conviene hacer una o dos simulaciones por sesión, sin ayuda y sin presión de tiempo real. El primer intento es el que cuenta para el reporte maestro, porque es el más espontáneo. Evite comentar cuál opción parece mejor mientras juega. Al terminar, use el reporte como punto de partida para conversar, visitar lugares de trabajo o hablar con profesionales de los campos que aparezcan.</p>'+
  '<p>Los resultados se guardan solo en el navegador del dispositivo donde se hicieron. Si se borra el historial o se cambia de dispositivo, se pierden; por eso cada reporte se puede compartir o imprimir.</p>'+
  '<p class="small muted">Los diez campos se eligieron por su perspectiva de demanda hacia 2030 y su menor exposición a ser reemplazados por completo por la IA, tomando como referencia el Future of Jobs Report 2025 del Foro Económico Mundial. Career Lab v3 es una herramienta exploratoria y no una prueba psicométrica validada. Sus pesos se irán calibrando con las primeras aplicaciones.</p></section>'+
  '<button class="btn full" id="back" type="button">Volver</button>');
  on("back",function(){S.name?viewHome():viewWelcome()});
}


var last=sget("last");if(last){S.name=last;loadP();askPersist();viewHome()}else viewWelcome();
})();
</script>
